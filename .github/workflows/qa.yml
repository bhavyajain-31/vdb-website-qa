name: Website QA
run-name: "Website QA (${{ inputs.mode || 'weekly new cycle' }})"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        options:
          - new-cycle
          - continue
          - retest-failed
        default: new-cycle
  schedule:
    - cron: '17 2 * * 1'

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: state
          key: qa-state-${{ github.run_id }}
          restore-keys: qa-state-
      - name: Run QA
        continue-on-error: true
        run: |
          case "${{ inputs.mode || 'new-cycle' }}" in
            new-cycle)     npx tsx src/run.ts --fresh ;;
            retest-failed) npx tsx src/run.ts --retest-failed ;;
            *)             npx tsx src/run.ts ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report
          path: reports/latest
          retention-days: 30
